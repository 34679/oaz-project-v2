<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Управление проектами - ОАЗ</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    <style>
        .manage-section {
            padding: 40px 0;
            background-color: var(--white);
            min-height: 100vh;
        }
        
        .manage-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }
        
        .manage-title {
            font-size: 1.8rem;
            font-weight: bold;
        }
        
        .btn-add {
            background-color: var(--accent-pink);
            color: var(--white);
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s;
        }
        
        .btn-add:hover {
            background-color: #e0456a;
        }
        
        .manage-card {
            background-color: var(--primary-blue);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        
        .manage-card-info h4 {
            color: var(--white);
            margin-bottom: 5px;
        }
        
        .manage-card-info p {
            color: rgba(255,255,255,0.8);
            font-size: 0.9rem;
        }
        
        .manage-card-actions {
            display: flex;
            gap: 10px;
        }
        
        .btn-edit, .btn-delete {
            padding: 8px 20px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.9rem;
        }
        
        .btn-edit {
            background-color: var(--white);
            color: var(--accent-pink);
        }
        
        .btn-edit:hover {
            background-color: var(--accent-pink);
            color: var(--white);
        }
        
        .btn-delete {
            background-color: var(--accent-pink);
            color: var(--white);
        }
        
        .btn-delete:hover {
            background-color: #e0456a;
        }
    </style>
</head>
<body>
    <!-- НАВИГАЦИЯ -->
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <i class="fas fa-water" style="color: #A0CDFF;"></i> ОА<span>З</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Главная</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="admin-projects.html">Проекты</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="donate.html">Благотворительность</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="manage-news.html">Новости</a>
                    </li>
                </ul>
                <ul class="navbar-nav" id="authNav">
                    <li class="nav-item">
                        <a class="nav-link" href="admin.html">
                            <i class="fas fa-user-shield"></i> Админ
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- УПРАВЛЕНИЕ ПРОЕКТАМИ -->
    <section class="manage-section">
        <div class="container">
            <!-- Заголовок -->
            <div class="manage-header">
                <h2 class="manage-title">
                    <i class="fas fa-arrow-left" onclick="history.back()" style="cursor: pointer; margin-right: 15px;"></i>
                    Проекты для благотворительности
                </h2>
                <button class="btn-add" onclick="openProjectModal()">
                    <i class="fas fa-plus"></i> Добавить
                </button>
            </div>
            
            <!-- Список проектов -->
            <div id="manageList">
                <!-- Карточки загружаются через JavaScript -->
            </div>
        </div>
    </section>

    <!-- Модальное окно добавления/редактирования -->
    <div class="modal fade" id="projectModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">Добавить проект</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="projectForm">
                        <input type="hidden" id="projectId">
                        
                        <div class="mb-3">
                            <label class="form-label">Название проекта</label>
                            <input type="text" class="form-control" id="projectName" required>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Описание</label>
                            <textarea class="form-control" id="projectDesc" rows="3" required></textarea>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Сумма пожертвования (руб)</label>
                                <input type="number" class="form-control" id="projectAmount" required min="1">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">URL изображения</label>
                                <input type="text" class="form-control" id="projectImage" placeholder="https://...">
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                    <button type="button" class="btn btn-danger" id="deleteProjectBtn" onclick="deleteProject()" style="display: none;">Удалить</button>
                    <button type="button" class="btn btn-primary" onclick="saveProject()" style="background-color: #F7567C; border: none;">Сохранить</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="js/main.js"></script>
    <script src="js/manage-projects.js"></script>
    <script>
        // Инициализация управления проектами
        document.addEventListener('DOMContentLoaded', function() {
            if (!AppState.currentUser || AppState.currentUser.role !== 'admin') {
                window.location.href = 'login.html';
                return;
            }
            loadManageProjects();
        });
    </script>
</body>
</html>
